<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance History</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(135deg, #e8d9ff, #f7eaff);
            font-family: "Poppins", sans-serif;
        }

        .navbar {
            background: #8e44ad !important;
        }

        .navbar-brand, .nav-link {
            color: white !important;
            font-weight: 600;
        }

        .nav-link:hover {
            color: #f3e8ff !important;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
        }

        h4 {
            color: #6a1b9a;
            font-weight: 700;
        }

        .table thead {
            background-color: #9b5de5;
            color: white;
            font-weight: 600;
        }

        .btn-outline-primary {
            border-radius: 30px;
            border-color: #9b5de5;
            color: #9b5de5;
            font-weight: 600;
        }

        .btn-outline-primary:hover {
            background-color: #9b5de5;
            color: white;
        }

        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: #f3e1ff33;  /* soft lavender stripe */
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            🌸 AI&DS Attendance
        </a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('attendance') }}">Attendance</a>
            <a class="nav-link active" href="{{ url_for('history') }}">History</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="card shadow-lg">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">📜 Attendance History</h4>

            <a href="{{ url_for('attendance') }}" class="btn btn-sm btn-outline-primary">
                ⬅ Back to Attendance
            </a>
        </div>

        <div class="card-body">
            {% if records %}
                <div class="table-responsive">
                    <table class="table table-striped align-middle shadow-sm rounded">
                        <thead>
                            <tr>
                                <th>S. No</th>
                                <th>Name</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for r in records %}
                            <tr>
                                <td>{{ r.sno }}</td>
                                <td>{{ r.name }}</td>
                                <td>{{ r.date }}</td>
                                <td>{{ r.time }}</td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            {% else %}
                <p class="text-muted mb-0">No attendance records found yet.</p>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
