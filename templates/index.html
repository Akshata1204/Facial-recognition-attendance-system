<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facial Recognition Attendance</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(135deg, #d9c7f5, #f3e8ff);
            height: 100vh;
            margin: 0;
            font-family: "Poppins", sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #6a1b9a;
            font-weight: 700;
        }

        p {
            color: #4e2a69;
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: #9b5de5;
            border-color: #9b5de5;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 30px;
        }

        .btn-primary:hover {
            background-color: #7c3aed;
            border-color: #7c3aed;
        }

        .btn-outline-secondary {
            color: #6a1b9a;
            border-color: #6a1b9a;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 30px;
        }

        .btn-outline-secondary:hover {
            background-color: #6a1b9a;
            color: white;
        }
    </style>
</head>

<body>
<div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-5 text-center">
        <h1 class="mb-4">
            🌸 WELCOME TO AI&DS<br>Facial Recognition Attendance System
        </h1>

        <p class="lead mb-4">
            An elegant, AI-powered real-time system that recognizes faces and automates attendance 
            with accuracy, security, and style.
        </p>

        <div class="d-flex gap-4 justify-content-center">
            <a href="{{ url_for('attendance') }}" class="btn btn-primary btn-lg">
                🚀 Take Attendance
            </a>
            <a href="{{ url_for('history') }}" class="btn btn-outline-secondary btn-lg">
                📘 View Attendance History
            </a>
        </div>
    </div>
</div>
</body>
</html>
